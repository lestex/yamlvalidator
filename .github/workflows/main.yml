name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: [ 'docs/**', '*.md' ]
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # pinned: unpinned lint tools start failing on unchanged code
        pip install \
          mypy==2.3.1 \
          ruff==0.16.4 \
          bandit==1.9.4 \
          types-PyYAML==6.0.12.20260815 \
          types-requests==2.33.0.20260712

    - name: Lint
      run: ruff check yamlvalidator tests

    - name: Check formatting
      run: ruff format --check yamlvalidator tests

    - name: Static types
      run: mypy yamlvalidator

    - name: Security scan
      run: bandit -r yamlvalidator

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14' ]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: pytest --cov=yamlvalidator
