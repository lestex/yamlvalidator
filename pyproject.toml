[project]
name = "yamlvalidator"
description = "Validate yaml based resources"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["yamlvalidator", "yaml"]
dynamic = ["version"]

authors = [
  {name = "Andrey Larin", email = "lestex@gmail.com" }
]

# For a list of valid classifiers, see https://pypi.org/classifiers/
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "PyYAML==6.0.1",
  "requests>=2.32.0,<3",
  "google-api-python-client==2.121.0",
  "typer>=0.9,<0.13",
  "click>=8.1,<8.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.0.2",
  "pytest_cov==4.1.0",
  "ruff==0.16.4",
]

[project.urls]  # Optional
"Homepage" = "https://github.com/lestex/yamlvalidator"
"Source" = "https://github.com/lestex/yamlvalidator"

[build-system]
# These are the assumed default build requirements from pip:
# https://pip.pypa.io/en/stable/reference/pip/#pep-517-and-518-support
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
yamlvalidator = "src.main:app"

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "C",  # flake8-comprehensions
  "B",  # flake8-bugbear
  "I",  # isort
]

[tool.ruff.lint.isort]
# one import per line, as the google isort profile used to enforce
force-single-line = true
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F811"]
"tests/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.pytest.ini_options]
filterwarnings = [
  "error",
  "ignore::UserWarning",
]

[tool.hatch]

[tool.hatch.build.targets.wheel]
include = [
  "src",
]

[tool.hatch.version]
path = "src/__init__.py"
